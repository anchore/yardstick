# only pull in version updates that were released more than a week ago (low-pass filter for quickly-retracted releases)
cooldown: 7d
# note: we are inheriting tool definitions from anchore/go-make .binny.yaml, so we only need to specify tools here that
# are not already defined there (or that we want to override with different versions).
tools:
  # Override go-make's default golangci-lint pin: the lint config relies on rules/behavior
  # introduced after v2.11.4 (the go-make embedded default) — notably, gosec G704 SSRF taint
  # analysis fires under v2.11.4 in code that lints clean under v2.12.2.
  - name: golangci-lint
    version:
      want: v2.15.0
    method: github-release
    with:
      repo: golangci/golangci-lint

  # generates the label UI's wire types from the Go response types
  - name: tygo
    version:
      want: v0.2.21
    method: go-install
    with:
      module: github.com/gzuidhof/tygo

  # override go-make's binny pin: 0.14 is the first to install bun (x64 assets) and tsc (keep-archive-files)
  - name: binny
    version:
      want: v0.14.0
    method: github-release
    with:
      repo: anchore/binny

  # runs the label UI's install, unit tests and Playwright (Taskfile.yaml runs it as .tool/bun)
  - name: bun
    version:
      want: bun-v1.4.3
    method: github-release
    with:
      repo: oven-sh/bun
      # skip the baseline, profile, musl and android builds
      assets: '^bun-[a-z]+-[a-z0-9]+\.zip$'

  # tsc 7 is native but reads lib/*.d.ts from beside itself, so the whole archive is kept
  - name: tsc
    version:
      want: v7.0.2
    method: github-release
    with:
      repo: microsoft/TypeScript
      keep-archive-files: true
