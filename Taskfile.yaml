version: "3"

# Orchestration for the label UI's end to end tests. The Go side (build, lint, test, generate, dev
# and the tool pins) lives in .make/main.go on go-make; `make e2e` and `make e2e-ui` run generate
# there and then forward here. Run through `task` directly, the UI must already be built.

vars:
  WEB: cmd/yardstick/internal/labelserver/web
  # Playwright runs on the pinned bun (1.4 runs Playwright Test and its UI mode), so no Node
  PLAYWRIGHT: "{{.ROOT_DIR}}/.tool/bun x --bun playwright"

tasks:
  e2e:
    desc: run the label UI's Playwright tests (HEADED=1 shows the browser; traces in web/test-results/; args after -- go to playwright)
    cmds:
      - task: playwright

  e2e-ui:
    desc: the label UI's Playwright tests in Playwright's UI mode
    cmds:
      - task: playwright
        vars:
          PLAYWRIGHT_ARGS: --ui

  playwright:
    internal: true
    cmds:
      - go build -o .tmp/e2e/seed ./cmd/yardstick/internal/testkit/seed
      # a no-op once chromium is in Playwright's cache; CI also installs its system packages
      - cd {{.WEB}} && {{.PLAYWRIGHT}} install ${CI:+--with-deps} chromium
      - cd {{.WEB}} && {{.PLAYWRIGHT}} test {{.PLAYWRIGHT_ARGS}} {{.CLI_ARGS}}

  fixtures:
    desc: regenerate test fixtures with the real, pinned syft, grype, vexctl and oras (needs docker)
    dir: cmd/yardstick/internal/fixture
    cmds:
      - ./generate.sh
      - ./generate-vex.sh
      - ./generate-vml.sh
      - ./generate-cpes.sh
